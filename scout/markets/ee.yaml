country_code: EE
name: Estonia
languages: [et, ru]
# Russian is spoken far beyond Estonia: it counts only together with a region
# match or another signal (city, flag, domain, local word).
shared_languages: [ru]
currency: EUR

market_signals:
  flags: ["🇪🇪"]
  tlds: [".ee"]
  cities: [Tallinn, Tartu, Narva, Pärnu, Kohtla-Järve, Viljandi, Rakvere, Maardu, Kuressaare, Haapsalu, Sillamäe,
           Таллинн, Тарту, Нарва, Пярну, Кохтла-Ярве, Силламяэ, Маарду, Йыхви]
  words: [eesti, eestlane, eestis, eestikeelne, mängimine, koostöö, koostööd, tere, aitäh,
          эстония, эстонии, эстонец, эстонка, эстонский, таллине]

# Gaming-specific hashtags in the local languages. Harvested without a proxy.
seed_hashtags:
  - mängimine
  - eestigamer
  - eestigaming
  - mänguarvuti
  - arvutimängud
  - eestistriimer
  - gamingeesti
  - mängur
  - eestigamers
  - gtaeesti
  - eestigta
  - gtarpeesti
  - eestirp
  - геймерэстония
  - эстонскийгеймер
  - игрыэстония

# Global game and hardware hashtags. Results are dominated by other countries,
# so they are fetched through a proxy in the market and filtered by region.
global_hashtags:
  - cs2
  - fortnite
  - minecraft
  - valorant
  - roblox
  - pcbuild
  - gamingsetup
  - геймер
  - игровойпк
  - сборкапк
  - кс2
  - майнкрафт

# General country tags bring mostly lifestyle creators. Used only on request.
general_hashtags:
  - eestitiktok
  - eesti
  - eestiyoutuber
  - tallinn
  - эстония

seed_keywords:
  - eesti gamer
  - mänguarvuti
  - arvutimängud
  - eesti striimer
  - cs2 eesti
  - fortnite eesti
  - геймер эстония
  - игровой пк таллинн
  - стрим эстония

# YouTube search queries (sent with regionCode set to the market).
youtube_queries:
  - minecraft eesti keeles
  - eesti keeles mängime
  - roblox eesti keeles
  - fortnite eesti
  - gta eesti keeles
  - gta rp eesti
  - õudusmängud eesti keeles
  - eesti youtuber mängud
  - let's play eesti keeles
  - cs2 eesti
  - mänguarvuti eesti
  - arvuti kokkupanek
  - eesti gamer

# Characters that occur in the local language and rarely elsewhere.
distinct_chars: ["õ"]

# Terms that raise a candidate's enrichment priority. They never exclude anyone.
gaming_terms: [mängimine, mängur, mängud, mänguarvuti, arvutimängud, striim, striimer,
               игры, игра, геймер, стрим, стример, игровой, сборка пк, киберспорт, кс2, майнкрафт]

# Local PC and electronics retailers and competitors. Off by default: they
# mostly follow mainstream influencers. ``handle`` is used directly when known;
# otherwise ``query`` is resolved through user search.
retailer_seeds:
  - {name: Arvutitark, query: arvutitark}
  - {name: Photopoint, query: photopoint}
  - {name: Klick, query: klick eesti}
  - {name: Euronics Eesti, query: euronics eesti}
  - {name: 1a.ee, query: 1a.ee}
  - {name: Kaup24, query: kaup24}

ad_markers: [reklaam, koostöös, koostöö, sponsoreeritud, tasuline koostöö, реклама, партнерство, спонсор]
