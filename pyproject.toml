[project]
name = "creator-scout"
version = "0.1.0"
description = "Find small, niche creators per country and language, and produce an outreach-ready sheet."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
web = ["uvicorn>=0.29"]
dev = ["pytest>=8", "uvicorn>=0.29"]

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
